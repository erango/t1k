[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.19"
edition = "2021"
license = "MIT"

[workspace.dependencies]
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
alacritty_terminal = "0.26.0"
anyhow = "1"
log = "0.4"
env_logger = "0.11"

[profile.release]
# Line tables go into a separate dSYM (split-debuginfo) that scripts/release.sh uploads to
# Sentry, so crash reports name the code; the shipped binary is stripped.
debug = "line-tables-only"
split-debuginfo = "packed"
strip = "symbols"

# GPUI 0.2.2 with one fix: nextDrawable may time out instead of freezing the app
# (see vendor/gpui/src/platform/mac/metal_renderer.rs, "T1K patch"). Drop when a gpui
# release includes zed-industries/zed#67486.
[patch.crates-io]
gpui = { path = "vendor/gpui" }
