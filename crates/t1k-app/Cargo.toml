[package]
name = "t1k-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "t1k"
path = "src/main.rs"

[dependencies]
gpui.workspace = true
t1k-terminal = { path = "../t1k-terminal" }
t1k-themes = { path = "../t1k-themes" }
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
t1k-agent = { path = "../t1k-agent" }
toml = "0.8"
plist = "1"
toml_edit = "0.22"
pulldown-cmark = { version = "0.13", default-features = false }
nucleo-matcher = "0.3"
libc = "0.2"
objc = "0.2"
block = "0.1"
cocoa = "0.26"
sentry = { version = "0.49", default-features = false, features = ["backtrace", "contexts", "debug-images", "panic", "reqwest", "rustls", "log"] }
emojis = "0.9.1"
sha2 = "0.10"

[lints.rust]
# objc 0.2 macros test cfg(feature = "cargo-clippy").
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
