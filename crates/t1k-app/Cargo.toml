[package]
name = "t1k-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "t1k"
path = "src/main.rs"

[dependencies]
gpui.workspace = true
t1k-terminal = { path = "../t1k-terminal" }
t1k-themes = { path = "../t1k-themes" }
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
t1k-agent = { path = "../t1k-agent" }
toml = "0.8"
toml_edit = "0.22"
nucleo-matcher = "0.3"
libc = "0.2"
