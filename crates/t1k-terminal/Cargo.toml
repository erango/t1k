[package]
name = "t1k-terminal"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gpui.workspace = true
alacritty_terminal.workspace = true
anyhow.workspace = true
log.workspace = true
futures = "0.3"
libc = "0.2"
objc = "0.2"
# Same version alacritty_terminal polls the pty with (the pty wrapper names its types).
polling = "3"

[lints.rust]
# objc 0.2 macros test cfg(feature = "cargo-clippy").
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
